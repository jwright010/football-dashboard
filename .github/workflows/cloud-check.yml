name: Cloud check

# Runs only when you press "Run workflow" in the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install httpx

      - name: Run the check
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: "1151985"
          ESPN_SEASON_ID: "2026"
          YAHOO_PUBLIC_LEAGUE_ID: "1335544"
        run: python cloud_check.py
